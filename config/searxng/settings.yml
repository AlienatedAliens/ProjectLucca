# SearXNG settings for Project Lucca
use_default_settings: true

general:
  debug: false
  instance_name: "Lucca Search"

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "lucca-local-searxng-secret-key-32b"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

outgoing:
  request_timeout: 4.0
  max_request_timeout: 6.0
  useragent_suffix: ""

engines:
  - name: wikidata
    disabled: true
  - name: brave
    disabled: true
  - name: ahmia
    disabled: true
  - name: torch
    disabled: true
  - name: google cse
    disabled: true
  - name: duckduckgo
    engine: duckduckgo
  - name: bing
    engine: bing
  - name: wikipedia
    engine: wikipedia
