[project]
name = "epistemic-guard"
version = "0.3.0"
description = "Signed tool receipts, Ed25519 memory write-gating, and RAG source deduplication for Python agents (CPU/NPU, zero LLM calls)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sean Maxwell" }]
requires-python = ">=3.10"
keywords = [
    "agents",
    "mcp",
    "tool-calling",
    "ed25519",
    "provenance",
    "rag",
    "openvino",
    "guardrails",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "openvino>=2025.0.0",
    "tokenizers>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "import-linter>=2.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
epistemic-guard = "epistemic_guard.cli:main"

[project.urls]
Repository = "https://github.com/AlienatedAliens/ProjectLucca/tree/main/packages/epistemic-guard"
Issues = "https://github.com/AlienatedAliens/ProjectLucca/issues"
"Author ORCID" = "https://orcid.org/0009-0004-0133-0463"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epistemic_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/MODEL_NOTICES.md",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["openvino.*", "tokenizers.*"]
ignore_missing_imports = true

