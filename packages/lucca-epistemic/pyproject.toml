[project]
name = "lucca-epistemic"
version = "0.2.0"
description = "Standalone cross-platform epistemic verification, RFC 8032 Ed25519 provenance envelopes, 2D hazard-scaled Walton corroboration, and OpenVINO CPU/NPU receipt supervision"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
    "numpy>=1.26.0",
    "openvino>=2025.0.0",
    "tokenizers>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "import-linter>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucca_epistemic"]
