      kind: test
      ref: src/lucca/core/affect.py
      criteria: PAD ODE transitions bound to CognitiveOutcomeSink and TTS prosody modulation
    evidence:
      - src/lucca/core/affect.py
      - src/lucca/core/cognitive_sink.py
    failure_modes:
