    competitor_refs: []
    target_maturity_v2: L3

  # --- Honesty & Safety ---
  - id: CAP-HONEST
    job: never claim an unexecuted action happened
    maturity: L2
    maturity_basis: author-measured
    stub: false
    risk_class: A
    tools:
      - artifact_verify
    acceptance:
      kind: artifact
      ref: papers/02_deontic_supervision_evasion/main.tex
      criteria: classifier supervisor shadow-mode ledger >= 30 days with FP <= 2%
    evidence:
      - src/lucca/sandbox/output_supervisor.py
      - papers/02_deontic_supervision_evasion/main.tex
    failure_modes:
      - regex supervisor caught 1/16 held-out evasive prose claims; GBNF prose leakage 14.17%
    competitor_refs: []
    target_maturity_v2: L3

  - id: CAP-SELFINFO
    job: accurate self-knowledge of tools, model, and hardware telemetry
    maturity: L3
    maturity_basis: unit-tested
    stub: false
    risk_class: A
    tools:
      - query_capabilities
      - sys_info
      - self_metrics
    acceptance:
      kind: test
      ref: tests/test_capabilities.py
      criteria: capabilities substrate answers from live registry and abstains if unavailable
    evidence:
      - src/lucca/core/capabilities.py
      - src/lucca/core/cascade.py
    failure_modes:
      - freeform LLM answer if router bypasses capabilities substrate
    competitor_refs: []
    target_maturity_v2: L4

  - id: CAP-PRIVACY
    job: local-only execution with zero cloud telemetry in product path
    maturity: L3
    maturity_basis: unit-tested
    stub: false
    risk_class: A
    tools: []
    acceptance:
      kind: script
      ref: luccadocs/ARCHITECTURE.md
