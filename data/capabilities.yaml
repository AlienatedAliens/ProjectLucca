    competitor_refs: []
    target_maturity_v2: L4

  - id: CAP-SAFE-ACT
    job: intercept destructive commands and prompt injections
    maturity: L3
    maturity_basis: author-measured
    stub: false
    risk_class: A
    tools: []
    acceptance:
      kind: test
      ref: luccadocs/security/THREAT_MODEL.md
      criteria: policy gates, sequence guard, single-use HMAC confirmation tokens, 20/20 authored injection suite
    evidence:
      - luccadocs/security/THREAT_MODEL.md
      - src/lucca/sandbox/policy.py
    failure_modes:
      - self-authored red-team suite; no external third-party red-team yet
    competitor_refs: []
    target_maturity_v2: L3

