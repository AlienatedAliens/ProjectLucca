standing_rules:
  - "A dataset range may be labeled 'held-out' only if EXPOSURE.yaml shows zero prior runs and zero prompt inspections against it."
  - "Any run used to choose harness versions, prompts, decoding, or router config marks every item it touched as tuning-exposed."
  - "New evaluation sets must be hashed into this file at creation, sealed (no run), and pre-registered in plans/AUDIT_REGISTER.md before first execution."
  - "Artifact filenames must be timestamped at write time (E-19); overwriting a canonical path is prohibited for evaluation runs."
