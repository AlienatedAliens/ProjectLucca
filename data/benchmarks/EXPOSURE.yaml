# Project Lucca — Dataset Exposure Ledger
#
# Phase 2.4 of the 2026-10-06 criticism remediation. Purpose: record every
# run that touched each benchmark dataset, so that "held-out" labels mean
# what they say. Built from artifact metadata by scratch/phase2_exposure_scan.py
# (2026-10-06); every row cites an artifact that exists in the repo.
#
# Decision rule (from the criticism, Phase 2.4 spec): if an evaluation
# protocol draws items from a file whose items were already run — especially
# during a tuning/ablation campaign — the run is NOT a clean held-out test.
#
# Status vocabulary: exposed (run at least once), tuning-exposed (run during
# an iterative harness/config-tuning campaign), inspection-exposed (prompts
# read by a human without a run), sealed (hash recorded, no run since seal).

as_of: "2026-10-06"
method: >
  Every JSON artifact under logs/test_reports/ (recursive) was scanned for
  dataset markers (dataset_path fields, benchmark names, split labels).
  File mtimes give first-seen dates; embedded git_commit fields give the
  tree state where the harness recorded one. Artifacts without embedded
  commits are marked commit: null (unverifiable from the artifact alone).

