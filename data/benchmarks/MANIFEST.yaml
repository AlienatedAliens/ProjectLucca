# Project Lucca — Benchmark Provenance Manifest
#
# Canonical registry of benchmark evaluation records. Every published numeric
# benchmark claim (papers, architecture docs, user guide, DECISIONS) MUST cite
# a record_id from this file. Figures without a record are not citable.
#
# This manifest resolves the MATH-500 "three different numbers" problem: the
# 77.0/87.0, 74.20/78.80, and 89.0/94.0 figures are NOT competing measurements
# of one experiment. They are three distinct, versioned experiments with
# different datasets, graders, and harness builds. Each gets its own record.
#
# Generated: 2026-10-05 (v1.35.6). Records were reconstructed from run artifacts
# under logs/test_reports/. Fields marked null were not recorded by the harness
# at the time of the run; they are gaps to be closed by future runs, not guesses.

