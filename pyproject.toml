[project]
name = "project-lucca"
version = "1.35.7"
description = "Local-first sandboxed desktop companion with real-time voice, four-process topology, and compiled symbolic reasoning"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "pyzmq>=26.0.0",
    "numpy>=1.26.0,<2.3.0",
    "sounddevice>=0.4.7",
    "onnxruntime>=1.18.0",
    "openvino>=2025.0.0",
    "openvino-genai>=2025.0.0",
    "openvino-tokenizers>=2025.0.0",
    "kokoro-onnx>=0.3.0",
    "sqlite-vec>=0.1.6",
    "rapidfuzz>=3.9.0",
    "structlog>=24.0.0",
    "psutil>=6.0.0",
    "PyQt6>=6.7.0",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.5.0",
    "python-ulid>=2.0.0",
    "rich>=13.7.0",
    "networkx>=3.3.0",
    "z3-solver>=4.13.0",
    "ddgs>=9.16.0",
    "pypdf>=5.0.0",
    "playwright>=1.40.0",
    "truststore>=0.10.0",
    "mss>=10.2.0",
    "pillow>=12.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
    "import-linter>=2.0.0",
    "faster-whisper>=1.0.0",
    "jiwer>=3.0.0",
]

[project.scripts]
lucca-admin = "lucca.admin:main"
lucca = "lucca.main:main"
lint = "lucca.tools.lint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lucca"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "S", "UP", "ANN", "PL"]
ignore = ["PLR0913", "PLR2004", "S105", "PLR0911", "PLR0912", "PLR0915", "PLR0917", "S311", "S324"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "ANN", "PLR", "BLE001", "PLC0415", "E501"]
"scripts/*" = ["S", "F", "PL", "ANN", "PLC0415", "BLE001", "E501", "E741"]
"packaging/*" = ["S", "F", "PL", "ANN", "PLC0415", "BLE001", "E501"]
"**/env_check.py" = ["BLE001", "PLC0415", "S603", "S607"]
"**/ui/*" = ["E501", "S603", "S607", "BLE001", "ANN", "S110", "E402"]
"**/sandbox/*" = ["PLW0603", "S603", "S110", "BLE001", "E402"]
"**/senses/*" = ["PLC0415", "S110", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "sounddevice.*",
    "openvino.*",
    "kokoro_onnx.*",
    "sqlite_vec.*",
    "zmq.*",
    "PyQt6.*",
    "transformers.*",
    "faster_whisper.*",
    "ulid.*",
    "psutil.*",
    "torch.*",
    "z3.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]
asyncio_mode = "auto"
addopts = "--strict-markers -m 'not hw and not soak and not tier2 and not net'"
markers = [
    "hw: Hardware-dependent tests (NPU/dGPU/Audio)",
    "soak: Long-running stability and soak tests",
    "tier2: Fake-backed integration tests (no hardware)",
    "net: Requires outbound network egress via the WSL2 sandbox",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
