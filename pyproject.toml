[project]
name = "project-lucca"
version = "0.1.0"
description = "Local-first sandboxed desktop companion with real-time voice and compiled symbolic reasoning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "sounddevice>=0.4.6",
    "scipy>=1.12.0",
    "requests>=2.31.0",
    "openvino>=2024.4.0",
    "onnxruntime>=1.18.0",
    "xgboost>=2.0.3",
    "networkx>=3.3",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "rich>=13.7.0",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
